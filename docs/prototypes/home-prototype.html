<!doctype html>
<!--
  THROWAWAY PROTOTYPE — do not ship.
  Component-by-component exploration for Hemera's home.
  Pages: #/composer (session input, variants 1–3) · #/project (project selection, variants 1–3)
  Switch variants with the floating bar or ← →. `t` toggles theme.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Hemera components</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --p:#d946ef; --p-600:#c026d3; --p-soft:#fdf4ff; --p-soft2:#fae8ff; --p-ring:rgba(217,70,239,.25); --p-text:#a21caf;
    --bg:#ededf0; --surface:#ffffff; --surface2:#f6f6f8; --surface3:#e9e9ee; --line:#e2e2e8; --line2:#d3d3db;
    --text:#111118; --muted:#6b6b7b; --dim:#9a9aa8;
    --ok:#16a34a; --ok-soft:#ecfdf3; --warn:#d97706; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2; --info:#2563eb; --info-soft:#eff6ff;
    --define:#7c3aed; --define-soft:#f3efff; --build:#0891b2; --build-soft:#ecfeff; --free:#6b6b7b; --free-soft:#f1f1f4;
    --shadow:0 1px 2px rgba(16,16,24,.05),0 1px 3px rgba(16,16,24,.04); --shadow-lg:0 12px 32px rgba(16,16,24,.12);
    --sans:"Inter",system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  html[data-theme=dark]{
    --p:#e879f9; --p-600:#d946ef; --p-soft:rgba(232,121,249,.10); --p-soft2:rgba(232,121,249,.18); --p-ring:rgba(232,121,249,.3); --p-text:#f0abfc;
    --bg:#040406; --surface:#18181e; --surface2:#0e0e12; --surface3:#121217; --line:#27272f; --line2:#363640;
    --text:#ececf1; --muted:#9a9aab; --dim:#62627a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.10); --bad:#f87171; --bad-soft:rgba(248,113,113,.10); --info:#60a5fa; --info-soft:rgba(96,165,250,.10);
    --define:#a78bfa; --define-soft:rgba(167,139,250,.12); --build:#22d3ee; --build-soft:rgba(34,211,238,.10); --free:#9a9aab; --free-soft:rgba(154,154,171,.12);
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 14px 40px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;cursor:pointer} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer} input,textarea{font:inherit;color:inherit}
  svg.lucide{width:16px;height:16px;flex:none;stroke-width:2} .i14 svg.lucide,svg.lucide.i14{width:14px;height:14px} .i20 svg.lucide,svg.lucide.i20{width:20px;height:20px} .i24 svg.lucide,svg.lucide.i24{width:24px;height:24px}
  .mono{font-family:var(--mono);font-size:12px} .muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px} .xs{font-size:11px} .b{font-weight:600}
  .row{display:flex;align-items:center;gap:8px} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column} .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .frame{background:var(--surface3);border:1px solid var(--line);border-radius:16px;padding:6px}
  .frame>.fh{display:flex;align-items:center;gap:8px;padding:8px 10px 10px;font-weight:600}
  .frame>.fh .links{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px}
  .frame>.fh .links a{color:var(--p-text)} .frame>.fh .links a:hover{text-decoration:underline}
  .frame>.fb{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);transition:.12s}
  .btn:hover{border-color:var(--p);color:var(--p-text)} .btn.primary{background:var(--p);border-color:var(--p);color:#fff;font-weight:600} .btn.primary:hover{background:var(--p-600);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none} .btn.ghost:hover{background:var(--surface2)} .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px} .btn.icon{padding:7px;width:32px;height:32px;justify-content:center} .btn.icon.sm{width:28px;height:28px;padding:5px} .btn[disabled]{opacity:.45;pointer-events:none}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:600;line-height:1.2} .chip svg.lucide{width:14px;height:14px;stroke-width:2.4}
  .chip.lg{padding:7px 12px;font-size:13.5px;border-radius:11px} .chip.lg svg.lucide{width:18px;height:18px}
  .chip.define{background:var(--define-soft);color:var(--define)} .chip.build{background:var(--build-soft);color:var(--build)} .chip.free{background:var(--free-soft);color:var(--free)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.p{background:var(--p-soft2);color:var(--p-text)} .chip.n{background:var(--surface3);color:var(--muted)}
  .chip.line{background:transparent;border:1px solid var(--line2);color:var(--muted);font-weight:500;cursor:pointer} .chip.line:hover{border-color:var(--p);color:var(--p-text)}
  .chip.x{cursor:pointer} .chip.x svg:last-child{opacity:.6}
  .kbd{font:11px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
  .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--p),#f59e0b);flex:none}
  .prov{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 9px var(--mono);color:#fff;flex:none} .prov.claude{background:#d97757} .prov.codex{background:#111} .prov.opencode{background:#0f766e} html[data-theme=dark] .prov.codex{background:#e5e5e5;color:#111}
  .sel{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface2);cursor:pointer;border:1px solid transparent} .sel:hover{border-color:var(--line2)} .sel b{color:var(--text);font-weight:500}
  .seg{display:inline-flex;background:var(--surface3);border-radius:9px;padding:2px} .seg .tab{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer} .seg .tab.on{background:var(--surface);box-shadow:var(--shadow);color:var(--text)}
  .send{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.15s} .send.off{background:var(--surface3);color:var(--dim)}
  .ta{width:100%;background:transparent;border:0;outline:0;font-size:14.5px;resize:none;min-height:48px;line-height:1.5} .ta::placeholder{color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)} .dot.running{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)} .dot.waiting{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
  .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:700 10px/16px var(--sans);text-align:center;border:2px solid var(--surface)}
  .pop{position:absolute;z-index:75;width:340px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;animation:up .15s}
  @keyframes up{from{transform:translateY(6px);opacity:0}}
  .pi{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer} .pi:hover,.pi.on{background:var(--surface2)} .pi .lg{width:34px;height:34px;border-radius:9px;position:relative}
  .pi .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);color:var(--dim);font-size:12.5px} .search input{border:0;outline:0;background:transparent;flex:1;color:var(--text)} .search input::placeholder{color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#16161c;color:#f4f4f6;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);font-size:12.5px;z-index:70;animation:up .2s} .toast .ok{color:#4ade80}
  .modal-bg{position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:80;display:grid;place-items:center;backdrop-filter:blur(2px)} .modal{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px}
  .h1{font:600 22px/1.2 var(--sans);letter-spacing:-.01em} .h2{font:600 16px/1.3 var(--sans)} .sect{font:600 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  .note{font-size:12px;color:var(--muted);margin:0 0 16px} .note b{color:var(--text)}

  /* ===== shell ===== */
  #marker{position:fixed;top:0;left:0;right:0;height:20px;z-index:50;background:repeating-linear-gradient(45deg,#fdf4ff 0 8px,#fae8ff 8px 16px);color:#a21caf;font:600 10px/20px var(--mono);letter-spacing:.06em;text-align:center;text-transform:uppercase;border-bottom:1px solid #f0abfc}
  html[data-theme=dark] #marker{background:repeating-linear-gradient(45deg,#2a0f2e 0 8px,#3b1440 8px 16px);color:#f0abfc;border-color:#701a75}
  #app{position:fixed;inset:20px 0 0 0;display:grid;grid-template-columns:248px 1fr;grid-template-rows:auto 1fr;transition:grid-template-columns .15s}
  #app.collapsed{grid-template-columns:58px 1fr}
  #app.collapsed .sidebar .nav span,#app.collapsed .sidebar .cmd span,#app.collapsed .sidebar .cmd .kbd,#app.collapsed .sidebar .nav .cnt{display:none}
  #app.collapsed .sidebar{padding:12px 10px} #app.collapsed .sidebar .nav,#app.collapsed .sidebar .cmd{justify-content:center;padding:0;width:38px;height:36px;margin:0 auto}
  .appbar{grid-column:1/-1;display:flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 0;border-bottom:1px solid var(--line);background:var(--bg)}
  .brandzone{width:248px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:100%;border-right:1px solid var(--line);margin-right:10px;transition:width .15s}
  #app.collapsed .brandzone{width:58px;padding:0;margin-right:10px;justify-content:center}
  .logobtn{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer} .logobtn .lg{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--p),#7c3aed);transition:.15s} .logobtn .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);opacity:0;transition:.15s}
  .logobtn:hover{background:var(--surface3)} .logobtn:hover .lg{opacity:0;transform:scale(.6)} .logobtn:hover .ico{opacity:1}
  .appbar .sepv{width:1px;height:18px;background:var(--line2);margin:0 6px}
  .pcur{display:inline-flex;align-items:center;gap:8px;padding:4px 8px 4px 5px;border-radius:9px;cursor:pointer;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)} .pcur:hover{border-color:var(--p)} .pcur .lg{width:20px;height:20px;border-radius:6px;position:relative;flex:none}
  .ppill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;border:1px solid transparent;white-space:nowrap} .ppill:hover{background:var(--surface3)} .ppill.on{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:var(--shadow)} .ppill.hot{color:var(--text)} .ppill .lg{width:14px;height:14px;border-radius:4px;flex:none} .ppill .n{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:700 10px/16px var(--sans);text-align:center}
  .ptile{display:inline-flex;align-items:center;gap:10px;padding:4px 10px 4px 5px;border-radius:11px;cursor:pointer;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)} .ptile:hover{border-color:var(--p)} .ptile .lg{position:relative;flex:none}
  .plogo{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;cursor:pointer;opacity:.8} .plogo:hover{opacity:1;background:var(--surface3)} .plogo .lg{width:22px;height:22px;border-radius:6px;position:relative;display:block} .plogo .tip{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#16161c;color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:11.5px;display:none;z-index:5} .plogo:hover .tip{display:block}
  #app.rail{grid-template-columns:60px 248px 1fr}
  .sidebar{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--bg)}
  .sidebar .grp{font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px}
  .sidebar .cmd{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--dim);font-size:12.5px;margin:2px 0 8px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow)} .sidebar .cmd:hover{border-color:var(--line2)}
  .sidebar .nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:.12s} .sidebar .nav svg{color:var(--dim);width:17px;height:17px} .sidebar .nav:hover{background:var(--surface3);color:var(--text)} .sidebar .nav:hover svg{color:var(--muted)} .sidebar .nav.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--text)} .sidebar .nav.on svg{color:var(--p)}
  .sidebar .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface3);padding:1px 7px;border-radius:999px} .sidebar .nav .cnt.p{background:var(--p);color:#fff}
  .sidebar .bottom{margin-top:auto;padding-top:10px}
  .pswitch{background:var(--surface3);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:10px;cursor:pointer;position:relative}
  .pswitch .ph{display:flex;align-items:center;gap:6px;padding:4px 6px 6px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  .pswitch .pb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)} .pswitch:hover .pb{border-color:var(--p)}
  .pswitch .lg{width:30px;height:30px;border-radius:8px;flex:none;position:relative}
  .inset{margin:8px 8px 8px 0;background:var(--surface2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none;background:var(--surface)}
  .topbar .crumb{display:flex;align-items:center;gap:6px} .topbar .crumb b{color:var(--text)} .topbar .crumb .p{color:var(--p-text);font-weight:500}
  .content{flex:1;overflow:auto;min-height:0;position:relative} .page{padding:26px 28px 110px;max-width:980px;margin:0 auto}
  /* project rail (variant P5) */
  .prail{padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px solid var(--line)}
  .prail .pa{width:38px;height:38px;border-radius:11px;position:relative;cursor:pointer;transition:.12s;opacity:.7} .prail .pa:hover,.prail .pa.on{opacity:1} .prail .pa.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--p)}
  .prail .pa .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:#16161c;color:#fff;padding:5px 9px;border-radius:7px;white-space:nowrap;font-size:12px;display:none;z-index:5} .prail .pa:hover .tip{display:block}
  .prail .pa.add{background:transparent;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--muted);opacity:1}
  /* project tabs (variant P2) */
  .ptabs{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;background:var(--surface3);border-bottom:1px solid var(--line)}
  .ptab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;border:1px solid transparent;border-bottom:0;position:relative;max-width:220px}
  .ptab:hover{background:var(--surface2)} .ptab.on{background:var(--surface);color:var(--text);border-color:var(--line);margin-bottom:-1px;padding-bottom:9px}
  .ptab .lg{width:16px;height:16px;border-radius:4px;flex:none;position:relative}
  .ptab .n{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:700 10px/16px var(--sans);text-align:center}
  /* launcher (P3) */
  .launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
  .pcard{padding:14px;cursor:pointer;transition:.12s;position:relative} .pcard:hover{border-color:var(--p);transform:translateY(-1px)} .pcard .lg{width:40px;height:40px;border-radius:11px;position:relative}
  .pcard .stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .pcard.add{border-style:dashed;background:transparent;box-shadow:none;display:grid;place-items:center;min-height:130px;color:var(--muted)}
  /* palette (P4) */
  .pal{width:620px;max-width:94vw;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
  .pal .head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)} .pal .head input{flex:1;border:0;outline:0;background:transparent;font-size:15px}
  .pal .grp{padding:10px 12px 4px} .pal .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
  /* composer variants */
  .cframe{background:var(--surface3);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
  .cframe .ch{display:flex;align-items:center;gap:8px;padding:8px 10px 10px;font-weight:600} .cframe .ch .links{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500} .cframe .ch .links a{color:var(--p-text)}
  .cbox{background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 10px;position:relative} .cbox:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring),var(--shadow)}
  .cbox .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ctx{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .mtile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface);transition:.12s} .mtile:hover{border-color:var(--line2)} .mtile.on{border-color:var(--p);background:var(--p-soft);box-shadow:0 0 0 3px var(--p-ring)}
  .mtile .t{font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:3px} .mtile .d{font-size:11.5px;color:var(--muted)}
  .mention{position:absolute;left:16px;bottom:56px;width:360px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:10}
  .mention .mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px} .mention .mi:hover,.mention .mi.on{background:var(--surface2)}
  .split{display:grid;grid-template-columns:1fr 300px;gap:8px}
  .ctxpane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px} .ctxpane .r{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)} .ctxpane .r:last-child{border-bottom:0}
  .cli{font-family:var(--mono);font-size:13px} .cli .pr{color:var(--p);font-weight:700}
  /* hero (C1) */
  .hero{padding:26px 0 0} .hero .greet{text-align:center;margin-bottom:18px}
  .cbox.big{padding:14px 18px 10px;border-radius:14px}
  .cframe .cf{display:flex;align-items:center;gap:6px;padding:10px 8px 4px}
  /* dock (C2) */
  .dockdemo{min-height:340px}

  /* flat layout (no inset card) */

    .tabsbar{align-items:flex-end;padding-bottom:0} .tabsbar .brandzone{align-self:stretch} .tabsbar .grow~*{margin-bottom:8px}

<script>
/* ============ data ============ */
const PROJECTS = [

  { key:'docs', name:'Hemera', path:'~/projects/hemera', repos:[], grad:'linear-gradient(135deg,#f59e0b,#ef4444)', kbd:'3', running:0, attn:0, done:1, last:'3 d ago', lastSession:'Free · Spec map review', design:true },

const SPECS = [ ['ATL-42','feature','CSV invoice export','in_progress'], ['ATL-45','bug','Double signup e-mail','ready'], ['ATL-47','maintenance','Migrate to Drizzle 1.0','draft'], ['ATL-39','feature','Full-text search','in_progress'] ];

/* ============ state ============ */
const params = new URLSearchParams(location.search);
const S = { theme: params.get('theme')==='dark'?'dark':'light', v:{ home:+(params.get('hv')||2), composer:+(params.get('cv')||1), project:+(params.get('pv')||2) }, collapsed:false, layout: params.get('layout')==='inset'?'inset':'flat', project:'atlas',
  c:{ mission:'free', ws:'atlas-42', model:1, text:'', ctx:[], mention:null, mq:'', spec:null }, pop:null, toast:null, modal:null, palq:'' };
const P = () => PROJECTS.find(p=>p.key===S.project);
const ic = (n, cls='') => `<i data-lucide="${n}" class="${cls}"></i>`;
const chip = (m,t,i,lg) => `<span class="chip ${m} ${lg?'lg':''}">${i?ic(i):''}${t??m}</span>`;
const MI = { define:'pen-line', build:'hammer', free:'message-circle' };
const mchip = m => chip(m, m==='free'?'free chat':m, MI[m]);
const prov = p => `<span class="prov ${p}">${p==='claude'?'C':p==='codex'?'X':'O'}</span>`;
const typeChip = t => ({feature:chip('p','feature','sparkles'),bug:chip('bad','bug','bug'),maintenance:chip('info','maintenance','wrench')})[t];
const act = (a) => `data-act="${a}"`;
const badge = p => (p.attn+p.done)?`<span class="badge">${p.attn+p.done}</span>`:'';
const pbadges = p => `${p.running?chip('ok',`${p.running} running`,'loader-circle'):''}${p.attn?chip('warn',`${p.attn} need you`,'hand'):''}${p.done?chip('info',`${p.done} finished`,'check-check'):''}${!p.running&&!p.attn&&!p.done?chip('n','quiet'):''}`;
const route = () => (location.hash.replace(/^#\/?/,'')||'home').split('/')[0];
const VN = { home:{1:'Stacked frames',2:'Two columns',3:'Needs you first, dense list'}, composer:{1:'Launcher hero (framed)',2:'Dock bar',3:'Conversation opener'}, project:{1:'App bar · current + dropdown',2:'App bar · pills (chosen)',3:'App bar · big tile + others',4:'App bar · browser tabs'} };
const VQ = { home:{1:'Input on top, then one frame per concern: Needs you, Running, Finished, Specs.',2:'Input on top, then two columns: left what needs you + running; right activity + specs.',3:'Input on top, one loud “Needs you” block, then everything else as one dense list with filters.'}, composer:{1:'Our frame. Header hidden by default, appears to hold what you attach with @. Footer: workspace, model, New Spec / Start chat.',2:'A compact dock at the bottom of the inset, one line, expands on focus. Chat and Spec are two buttons on the right.',3:'Looks like the first message of a conversation. You answer; two reply cards decide Chat vs Spec.'}, project:{1:'A thin bar above sidebar and content, on the background. Current project + dropdown on the left; a bell aggregates the rest.',2:'Same bar, but every project is a pill with its counter. One click to switch, no dropdown.',3:'Same bar, current project as a bigger tile with path and status; other projects as small logos with counters.',4:'Browser-style tabs in the app bar: the active tab merges into the content below.'} };

/* ============ shell ============ */
function sidebar(r){
  const nav = (page, icon, label) => `<a class="nav ${r===page?'on':''}" href="#/${page}">${ic(icon)}<span>${label}</span></a>`;
  return `<aside class="sidebar">
    <div class="cmd" ${act('palette')}>${ic('command')}<span class="grow">Command</span><span class="kbd">⌘K</span></div>
    ${nav('home','house','Home')}
    <a class="nav">${ic('messages-square')}<span>Sessions</span><span class="cnt p">3</span></a>
    <a class="nav">${ic('file-text')}<span>Specs</span><span class="cnt">4</span></a>
    <div class="grp">Workspace</div>
    <a class="nav">${ic('git-branch')}<span>Workspaces</span><span class="cnt">3</span></a>
    <a class="nav">${ic('play')}<span>Commands</span></a>
    <a class="nav">${ic('terminal')}<span>Terminal</span></a>
    <div class="grp">Project</div>
    <a class="nav">${ic('scroll-text')}<span>Journal</span></a>
    <a class="nav">${ic('pen-line')}<span>Agent instructions</span></a>
    <div class="bottom">
      <a class="nav" ${act('theme')}>${ic(S.theme==='light'?'moon':'sun')}<span>${S.theme==='light'?'Dark mode':'Light mode'}</span></a>
      <a class="nav">${ic('settings')}<span>Settings</span></a>
      <div style="height:1px;background:var(--line);margin:8px 4px"></div>
      ${nav('composer','sparkles','Input variants')}
      ${nav('project','folder','Project variants')}
    </div></aside>`;
}
const others = () => PROJECTS.filter(x=>x.key!==S.project);
const otherNotifs = () => others().reduce((a,x)=>a+x.attn+x.done,0);
function dropdown(pos){
  return `<div class="pop" style="${pos||'left:0;top:100%;margin-top:6px'};width:360px" onclick="event.stopPropagation()">
    <div class="search" style="margin:2px 2px 6px">${ic('search')}<input placeholder="Switch project…" autofocus></div>
    ${PROJECTS.map(p=>`<a class="pi ${p.key===S.project?'on':''}" ${act('switch:'+p.key)}><span class="lg" style="background:${p.grad}">${badge(p)}</span><div><div class="row"><b>${p.name}</b>${p.key===S.project?chip('p','open'):''}</div><div class="badges">${pbadges(p)}</div></div><span class="kbd">⌘${p.kbd}</span></a>`).join('')}
    <div style="height:1px;background:var(--line);margin:6px 4px"></div>
    <a class="pi" ${act('open-folder')}><span class="lg" style="background:var(--surface3);display:grid;place-items:center;color:var(--muted)">${ic('folder-plus')}</span><div><b>Open a folder…</b></div><span class="kbd">O</span></a></div>`;
}
function bellPop(){
  const items = [];
  PROJECTS.forEach(p=>{ if(p.attn) items.push([p,'hand','warn',`${p.attn} decision${p.attn>1?'s':''} waiting`]); if(p.done) items.push([p,'check-check','info',`${p.done} session${p.done>1?'s':''} finished`]); });
  return `<div class="pop" style="right:0;left:auto;top:100%;margin-top:6px;width:380px" onclick="event.stopPropagation()">
    <div class="row" style="padding:6px 8px 8px"><b class="grow">Across projects</b><a class="xs" style="color:var(--p-text)" ${act('clear-all')}>Mark all seen</a></div>
    ${items.map(x=>`<a class="pi" style="grid-template-columns:28px 1fr auto" ${act('switch:'+x[0].key)}><span class="chip ${x[2]}" style="padding:5px 6px">${ic(x[1])}</span><div><div class="b">${x[3]}</div><div class="xs muted">${x[0].name}${x[0].key===S.project?' · this project':''} · ${x[0].last}</div></div><span class="btn sm">Open</span></a>`).join('')||'<div class="pi dim">Nothing waiting anywhere.</div>'}</div>`;
}
function topbar(r){
  const crumb = `<span class="p">${r==='composer'?'Session input':'Project selection'} · variant ${S.v[r]}</span>`;
  return `<div class="topbar"><button class="btn ghost icon sm">${ic('panel-left')}</button><span class="crumb"><b>${P().name}</b>${ic('chevron-right','i14')}${crumb}</span><span class="grow"></span><div class="search" style="width:220px">${ic('search')}<span class="grow">Search…</span><span class="kbd">⌘K</span></div><div class="avatar"></div></div>`;
}
function appbar(){
  const p = P(); const v = S.v.project;
  const bell = `<div style="position:relative"><button class="btn ghost icon sm" ${act('pop:bell')} style="position:relative">${ic('bell')}${otherNotifs()?`<span class="badge" style="top:-2px;right:-2px">${otherNotifs()}</span>`:''}</button>${S.pop==='bell'?bellPop():''}</div>`;
  const brand = S.collapsed ? `<div class="brandzone"><span class="logobtn" ${act('collapse')} title="Open sidebar"><span class="lg"></span><span class="ico">${ic('panel-left-open')}</span></span></div>` : `<div class="brandzone"><span style="width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--p),#7c3aed);display:inline-block;flex:none"></span><b class="small bname">Hemera</b><span class="grow"></span><button class="btn ghost icon sm" ${act('collapse')} title="Close sidebar">${ic('panel-left-close')}</button></div>`;
  if(v===1) return `<div class="appbar">${brand}<div style="position:relative"><span class="pcur" ${act('pop:projects')}><span class="lg" style="background:${p.grad}">${badge(p)}</span><b>${p.name}</b><span class="dim xs">${p.path}</span>${ic('chevron-down','i14')}</span>${S.pop==='projects'?dropdown():''}</div>
    <span class="xs muted" style="margin-left:6px">${p.running?`<span class="dot running" style="display:inline-block;width:6px;height:6px;margin-right:5px"></span>${p.running} running`:'quiet'}${p.attn?` · <span style="color:var(--warn)">${p.attn} need you</span>`:''}</span>
    <span class="grow"></span>${bell}<div class="avatar" style="width:22px;height:22px"></div></div>`;
  if(v===2) return `<div class="appbar">${brand}${PROJECTS.map(x=>`<span class="ppill ${x.key===S.project?'on':''} ${x.attn||x.done?'hot':''}" ${act('switch:'+x.key)} title="${x.path}"><span class="lg" style="background:${x.grad}"></span><span>${x.name}</span>${x.attn+x.done?`<span class="n">${x.attn+x.done}</span>`:x.running?`<span class="dot running" style="width:6px;height:6px"></span>`:''}</span>`).join('')}
    <span class="ppill" ${act('open-folder')} title="Open a folder">${ic('plus','i14')}</span>
    <span class="grow"></span>${bell}<div class="avatar" style="width:22px;height:22px"></div></div>`;
  if(v===4) return `<div class="appbar tabsbar">${brand}
    <div class="ptabs">${PROJECTS.map(x=>`<div class="ptab ${x.key===S.project?'on':''}" ${act('switch:'+x.key)} title="${x.path}"><span class="lg" style="background:${x.grad}"></span><span class="ell">${x.name}</span>${x.attn+x.done?`<span class="n">${x.attn+x.done}</span>`:x.running?`<span class="dot running" style="width:6px;height:6px"></span>`:''}</div>`).join('')}<div class="ptab" ${act('open-folder')} style="padding:8px 9px">${ic('plus','i14')}</div></div>
    <span class="grow"></span>${bell}<div class="avatar" style="width:22px;height:22px"></div></div>`;
  return `<div class="appbar" style="height:52px">${brand}<div style="position:relative"><span class="ptile" ${act('pop:projects')}><span class="lg" style="background:${p.grad};width:30px;height:30px;border-radius:8px">${badge(p)}</span><div><div class="row" style="gap:6px"><b>${p.name}</b>${ic('chevron-down','i14')}</div><div class="xs muted">${p.repos.join(' · ')||'no sources yet'} · ${p.running?p.running+' running':'quiet'}${p.attn?` · <span style="color:var(--warn)">${p.attn} need you</span>`:''}</div></div></span>${S.pop==='projects'?dropdown():''}</div>
    <span class="sepv"></span>

}
function statusStrip(){

/* ============ composer ============ */
const c = () => S.c;

const ctxChips = () => c().ctx.length?`<div class="ctx">${c().ctx.map((x,i)=>`<span class="chip ${x[0]==='spec'?'p':x[0]==='file'?'info':'n'} x" ${act('ctx-rm:'+i)}>${ic(x[0]==='spec'?'file-text':x[0]==='file'?'file-code':'play')}${x[1]}${ic('x')}</span>`).join('')}</div>`:'';

const actions = (sz='') => `<button class="btn ${sz}" ${act('go:define')} ${has()?'':'disabled'}>${ic('pen-line')} New Spec <span class="kbd" style="margin-left:2px">⇧↵</span></button><button class="btn primary ${sz}" ${act('go:free')} ${has()?'':'disabled'}>${ic('message-circle')} Start chat <span class="kbd" style="margin-left:2px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">↵</span></button>`;
function mentionPop(){
  const q = c().mq.toLowerCase();
  const items = [...SPECS.map(s=>['spec',s[0]+' · '+s[2],'file-text']), ...FILES.map(f=>['file',f,'file-code']), ...CMDS.map(x=>['cmd',x,'play'])].filter(x=>x[1].toLowerCase().includes(q)).slice(0,7);
  return `<div class="mention"><div class="search" style="margin-bottom:4px;box-shadow:none">${ic('at-sign')}<input id="mq" placeholder="Spec, file, command…" value="${c().mq}"></div>${items.map((x,i)=>`<div class="mi ${i===0?'on':''}" ${act('ctx-add:'+x[0]+':'+x[1].split(' · ')[0])}>${ic(x[2],'i14')}<span class="grow ell">${x[1]}</span>${chip('n',x[0])}</div>`).join('')||'<div class="mi dim">No match</div>'}</div>`;
}
function composer1(){ return `<div class="hero">
  <div class="greet"><div class="h1" style="font-size:26px">What are we doing in ${P().name}?</div><div class="muted">Talk freely, or turn it into a Spec. You decide when you send.</div></div>
  <div class="cframe">

    case 'prev': { const n=r==='project'?4:3; S.v[r] = ((S.v[r]-2+n)%n)+1; break; }
    case 'next': { const n=r==='project'?4:3; S.v[r] = (S.v[r]%n)+1; break; }
    case 'go': { if(!S.c.text.trim()){ toast('Type something first','pencil'); return; } toast(`${arg==='free'?'Free chat':'Define session (new Spec)'} created in ${P().name} · ${S.c.ws} · ${MODELS[S.c.model][1]}${S.c.ctx.length?' · '+S.c.ctx.length+' attached':''}`, arg==='free'?'message-circle':'pen-line'); S.c.text=''; S.c.ctx=[]; S.dock=false; S._focus=true; break; }
    case 'dock-open': if(!S.dock){ S.dock=true; S._focus=true; break; } return;
    case 'dock-close': S.dock=false; S.c.text=''; break;
    case 'clear-all': PROJECTS.forEach(p=>{ p.attn=0; p.done=0; }); S.pop=null; toast('All marked seen','check-check'); break;
    case 'v': S.v[r] = +arg; break;
    case 'theme': S.theme = arg || (S.theme==='light'?'dark':'light'); break;
    case 'pop': S.pop = S.pop===arg?null:arg; render(); setTimeout(()=>{const i=document.querySelector('.pop input');if(i)i.focus();},30); return;
    case 'pop-close': S.pop=null; break;
    case 'switch': { S.pop=null; S.modal=null; const p = PROJECTS.find(x=>x.key===arg); if(arg!==S.project){ S.project=arg; p.done=0; toast(`${p.name} opened · finished sessions marked seen`,'folder'); } break; }
    case 'open-folder': S.pop=null; S.modal=null; toast('Native folder picker','folder-plus'); break;
    case 'palette': S.modal='palette'; S.palq=''; S.palmode = arg==='needs'?'needs':null; overlay(); return;
    case 'modal-close': S.modal=null; overlay(); return;
    case 'toast-close': S.toast=null; overlay(); return;
    case 'recent': S.modal='recent'; overlay(); return;
    case 'tpl': S.modal='tpl'; overlay(); return;
    case 'tplpick': { const [m, ...t] = rest; S.c.mission=m; S.c.text=t.join(':'); S.modal=null; S._focus=true; break; }
    case 'mission': S.c.mission=arg; if(arg!=='build') S.c.spec=null; S._focus=true; break;
    case 'cycle': { if(arg==='ws') S.c.ws = WS[(WS.indexOf(S.c.ws)+1)%WS.length]; if(arg==='model') S.c.model=(S.c.model+1)%MODELS.length; if(arg==='mission'){ const M=['free','define','build']; S.c.mission=M[(M.indexOf(S.c.mission)+1)%3]; if(S.c.mission!=='build') S.c.spec=null; } break; }
    case 'pick-spec': S.modal='spec'; overlay(); return;
    case 'spec': S.c.spec = S.c.spec===arg?null:arg; S.modal=null; S.c.mission='build'; break;
    case 'mention': S.c.mention = S.c.mention===null?0:null; S.c.mq=''; break;
    case 'ctx-add': { const [k, v] = rest; if(!S.c.ctx.some(x=>x[1]===v)) S.c.ctx.push([k,v]); S.c.mention=null; S.c.mq=''; S.c.text = S.c.text.replace(/@\w*$/,''); S._focus=true; break; }
    case 'ctx-rm': S.c.ctx.splice(+arg,1); break;
    case 'ctx-clear': S.c.ctx=[]; break;
    case 'collapse': S.collapsed=!S.collapsed; break;
    case 'layout': S.layout=arg; break;
    case 'pv': S.v.project=+arg; break;
    case 'hf': S.homeFilter=arg; break;
    case 'seen-all': HOME.finished.forEach(f=>f.seen=true); PROJECTS[0].done=0; toast('All marked seen','check-check'); break;
    case 'seen': { const x = HOME.finished.find(f=>f.id===arg); if(x) x.seen=true; PROJECTS[0].done=Math.max(0,PROJECTS[0].done-1); toast('Marked seen','eye-off'); break; }
    case 'decide': { const i = HOME.needs.findIndex(x=>x.id===arg); if(i>-1){ const x=HOME.needs.splice(i,1)[0]; PROJECTS[0].attn=Math.max(0,PROJECTS[0].attn-1); toast(x.action+' · '+x.spec,'check'); } break; }
    case 'slash': { const m = arg.slice(1); if(['free','define','build'].includes(m)){ S.c.mission=m; S.c.text=''; } else if(m==='spec'){ S.modal='spec'; overlay(); return; } else { S.c.mention=0; S.c.mq='test'; } S._focus=true; break; }
    case 'send': { if(S.c.mission==='build'&&!S.c.spec){ toast('Build needs a ready Spec','triangle-alert'); return; } if(!S.c.text.trim()&&S.c.mission!=='build'){ return; } toast(`${S.c.mission==='free'?'Free chat':S.c.mission==='define'?'Define session':'Build on '+S.c.spec} created in ${P().name} · ${S.c.ws} · ${MODELS[S.c.model][1]}${S.c.ctx.length?' · '+S.c.ctx.length+' attached':''}`,'sparkles'); S.c.text=''; S.c.ctx=[]; S._focus=true; break; }
  }
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(t){ e.preventDefault(); e.stopPropagation(); handle(t.dataset.act, t); return; }
  if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); }
});
document.addEventListener('input', e => {
  if(e.target.id==='ta'){ S.c.text = e.target.value; const m = S.c.text.match(/@(\w*)$/); if(m){ S.c.mention=0; S.c.mq=m[1]; const box=e.target.closest('.cbox')||e.target.parentElement; const old=document.querySelector('.mention'); if(old) old.remove(); const div=document.createElement('div'); div.innerHTML=mentionPop(); (e.target.closest('.cbox')||e.target.parentElement).appendChild(div.firstChild); lucide.createIcons(); } else if(S.c.mention!==null){ S.c.mention=null; const old=document.querySelector('.mention'); if(old) old.remove(); }
    const s=document.querySelector('.send'); if(s) s.classList.toggle('off', !S.c.text.trim()&&!(S.c.mission==='build'&&S.c.spec)); }
  if(e.target.id==='mq'){ S.c.mq=e.target.value; const old=document.querySelector('.mention'); const div=document.createElement('div'); div.innerHTML=mentionPop(); old.replaceWith(div.firstChild); lucide.createIcons(); const i=document.getElementById('mq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  if(e.target.id==='palq'){ S.palq=e.target.value; overlay(); }
});
document.addEventListener('keydown', e => {
  const t = e.target; const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='p'){ e.preventDefault(); if(S.v.project===3) handle('palette'); else handle('pop:projects'); return; }
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(e.key==='['||e.key===']'||e.key==='{'||e.key==='}')){ e.preventDefault(); const i=PROJECTS.findIndex(p=>p.key===S.project); const n=(i+(e.key==='['||e.key==='{'?-1:1)+PROJECTS.length)%PROJECTS.length; handle('switch:'+PROJECTS[n].key); return; }
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&/^[1-5]$/.test(e.key)){ e.preventDefault(); handle('switch:'+PROJECTS[+e.key-1].key); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){ e.preventDefault(); location.hash='#/composer'; S.dock=true; S._focus=true; render(); return; }
  if(e.key==='Escape'){ if(S.modal){ S.modal=null; overlay(); return; } if(S.pop){ S.pop=null; render(); return; } if(S.c.mention!==null){ S.c.mention=null; render(); return; } }
  if(S.pop==='projects'||S.modal==='palette'){ const p = PROJECTS.find(x=>x.kbd===e.key); if(p){ handle('switch:'+p.key); return; } if(!typing&&e.key.toLowerCase()==='o'){ handle('open-folder'); return; } if(e.key==='Enter'){ const first=document.querySelector((S.modal?'.pal':'.pop')+' .pi[data-act^="switch"]'); if(first){ handle(first.dataset.act); return; } } }
  if(typing){
    if(t.id==='ta'){ if(e.key==='Enter'){ e.preventDefault(); if(S.c.mention!==null){ const first=document.querySelector('.mention .mi[data-act]'); if(first) handle(first.dataset.act); return; } handle(e.shiftKey?'go:define':'go:free'); } if(e.key==='Escape'&&S.dock){ handle('dock-close'); } }
    if(t.id==='mq'&&e.key==='Enter'){ e.preventDefault(); const first=document.querySelector('.mention .mi[data-act]'); if(first) handle(first.dataset.act); }
    return;
  }
  if(e.key==='ArrowLeft') handle('prev'); else if(e.key==='ArrowRight') handle('next'); else if(e.key==='t') handle('theme');
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
