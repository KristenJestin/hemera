name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      # The first push of a branch has no `before` (GitHub sends forty zeros): every commit the
      # branch holds is checked then, which for the first push of the repository is its first.
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            node tools/commit-message.ts --range "$head"
          else
            node tools/commit-message.ts --range "$base..$head"
          fi

  # React Doctor, the React-specific check: on a pull request it reads only the files the change
  # touches and fails on a finding at error level it brings in; on a push it reads everything. It
  # posts nothing anywhere: the log and the job summary hold the report.
  doctor:
    runs-on: ubuntu-latest
    env:
      REACT_DOCTOR_NO_TELEMETRY: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Scan the React code
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            set -- --scope changed --base "$base"
          fi
          set +e
          pnpm run doctor "$@" 2>&1 | tee "$RUNNER_TEMP/doctor.log"
          status=${PIPESTATUS[0]}
          {
            echo '## React Doctor'
            echo
            echo '```'
            cat "$RUNNER_TEMP/doctor.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      # Since Electron 42 the binary is downloaded on the first run of its `bin` script and
      # no longer by a postinstall hook. It is cached and fetched explicitly, so no job ever
      # pulls a hundred megabytes twice and no run downloads it behind a test.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      - working-directory: source
        run: pnpm typecheck
      - working-directory: source
        run: pnpm lint
      - working-directory: source
        run: pnpm fmt:check
      # The stories run as tests in a headless Chromium that Playwright downloads on demand; it
      # is cached like the Electron binary so no run fetches a browser twice.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}
      - name: Fetch the Playwright browser
        working-directory: source/packages/ui
        run: pnpm exec playwright install chromium --with-deps

      - working-directory: source
        run: pnpm build

      # The suites that need a window run in the `e2e` job below. The stories run headless,
      # which is a page and not a window.
      #
      # The step is capped: a suite that hangs fails this in twenty minutes rather than in the
      # fifty a Windows job once sat for, and the suites' own timeouts catch what really stalls.
      - name: Test
        working-directory: source
        timeout-minutes: 20
        run: pnpm test

  # Windows runs the same work as `verify` above, split over three runners side by side. On one
  # runner it took 23 to 26 minutes (#277): its four processors were full for the whole of the
  # repository suites, so the time was the sum of every test, not one slow test. Each part sets
  # up on its own, and `verify (windows-latest)` below is green only when all three are.
  windows:
    name: windows (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [checks and stories, repository 1/2, repository 2/2]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      - if: matrix.part == 'checks and stories'
        working-directory: source
        run: pnpm typecheck
      - if: matrix.part == 'checks and stories'
        working-directory: source
        run: pnpm lint
      - if: matrix.part == 'checks and stories'
        working-directory: source
        run: pnpm fmt:check
      - name: Cache the Playwright browser
        if: matrix.part == 'checks and stories'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}
      - name: Fetch the Playwright browser
        if: matrix.part == 'checks and stories'
        working-directory: source/packages/ui
        run: pnpm exec playwright install chromium
      # A Windows runner's temporary folder is on C:, the system disk, which saturates at a few
      # hundred writes a second. The suites write their repositories, worktrees and databases
      # there, and every `git` and `node` a test starts is read from that same disk. Measured:
      # with it on C:, C: was 85% busy, a write waited up to a third of a second, the
      # processors sat idle and one `git rev-parse` took 45 s, past a test's timeout. On D:, the
      # runner's local disk, the repository suites ran in 174 s instead of 285 s and no `git`
      # took more than 0.6 s.
      - name: Keep the temporary folder off the system disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # The `git` on a runner's PATH is Git for Windows' launcher, which starts the real `git.exe`
      # as a second process. Measured on a runner (#277): a `git --version` took 25 ms through it
      # and 13 ms straight, a `git status` 25 and 16 ms. The suites start a `git` for most of
      # what they check, so the real one comes first on PATH.
      - name: Start Git without its launcher
        shell: pwsh
        run: '"C:\Program Files\Git\mingw64\bin" >> $env:GITHUB_PATH'

      - working-directory: source
        run: pnpm build

      - name: Sample the processors and the disks (temporary)
        shell: pwsh
        run: |
          Start-Process typeperf -WindowStyle Hidden -ArgumentList @('"\Processor(_Total)\% Processor Time"', '"\PhysicalDisk(*)\% Idle Time"', '"\Memory\Available MBytes"', '-si', '5', '-f', 'CSV', '-o', "$env:RUNNER_TEMP\perf.csv", '-y')

      # The stories do not run beside the repository suites: there, the stories' two Chromiums
      # held the processors at full load and a `git` a suite starts took seconds instead of
      # milliseconds. Each part has a runner of its own instead.
      #
      # Each cap sits well above what the step takes, so that only a hang reaches it. Measured on
      # the twenty latest green Windows jobs (12 October 2026): the repository suites took 491 to
      # 893 s on one runner (the slowest within seconds of the old 900 s cap, and the suite is
      # still growing), the stories 123 to 252 s. The suites keep thirty minutes, twice the
      # slowest whole run; the stories keep fifteen, three and a half times theirs. The one story
      # run that reached fifteen minutes was a hang, not a slow run: every other one stayed under
      # 260 s.
      #
      # That hang is one story file that never reports (#244), which Vitest's browser mode waits
      # for without a limit. `tools/stories-watchdog.ts` fails the run after ninety seconds
      # without a finished file and names the file; the cap stays for what happens before that.
      #
      # Vitest splits the repository suites in two by their files: the two halves together run
      # every file, each once.
      - name: Test the repository suites
        if: startsWith(matrix.part, 'repository')
        working-directory: source
        timeout-minutes: 30
        run: pnpm test --project repository --shard=${{ matrix.part == 'repository 1/2' && '1/2' || '2/2' }}
      - name: Test the stories
        if: matrix.part == 'checks and stories'
        working-directory: source
        timeout-minutes: 15
        run: pnpm test --project storybook-light --project storybook-dark
      - name: Summarise the samples (temporary)
        if: always()
        shell: pwsh
        run: |
          Get-Process typeperf -ErrorAction SilentlyContinue | Stop-Process
          $rows = Import-Csv "$env:RUNNER_TEMP\perf.csv"
          $columns = $rows[0].PSObject.Properties.Name | Select-Object -Skip 1
          "samples: $($rows.Count) every 5 s"
          foreach ($column in $columns) {
            $values = $rows | ForEach-Object { $_.$column } | Where-Object { $_ -match '^[0-9. ]+$' } | ForEach-Object { [double]$_ }
            if ($values) { $m = $values | Measure-Object -Average -Minimum -Maximum; '{0}: avg {1:N1} min {2:N1} max {3:N1}' -f $column, $m.Average, $m.Minimum, $m.Maximum }
          }
          # One line a minute, to read the shape over the two test steps.
          $rows | Select-Object -Index (0..($rows.Count - 1) | Where-Object { $_ % 12 -eq 0 }) | Format-Table -AutoSize | Out-String -Width 400

  # The check the branch rules require, under the name it had when one runner did it all.
  windows-result:
    name: verify (windows-latest)
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Windows part passed
        run: test "${{ needs.windows.result }}" = success

  # The end-to-end suite, which drives the built application's window. A runner has no display,
  # so the window opens in a virtual X server (`xvfb-run`); the run needs no compositor of its
  # own there (`e2e/compositor.ts` starts none in CI). Ubuntu forbids the unprivileged user
  # namespaces Chromium's sandbox needs unless AppArmor is told otherwise.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}
      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron
      - name: Let Chromium's sandbox create its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - working-directory: source
        run: pnpm build
      - name: Run the end-to-end suite
        working-directory: source
        timeout-minutes: 30
        run: xvfb-run --auto-servernum --server-args='-screen 0 1366x768x24' pnpm --filter @hemera/desktop e2e:headless
