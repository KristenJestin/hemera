name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

# The specs live in their own repository, which is private: the traceability table is built
# against them where they are, never against a copy taken at some point.
env:
  DOCS_REPOSITORY: hemera-app/hemera-docs

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          node tools/commit-message.ts --range "$base..$head"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The two repositories are laid out the way a machine lays them out: the product, and
      # the documents above it.
      - uses: actions/checkout@v4
        with:
          path: sources/hemera
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPOSITORY }}
          token: ${{ secrets.DOCS_TOKEN }}
          path: docs-root

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: sources/hemera
        run: corepack enable

      # Since Electron 42 the binary is downloaded on the first run of its `bin` script and
      # no longer by a postinstall hook. It is cached and fetched explicitly, so no job ever
      # pulls a hundred megabytes twice and no run downloads it behind a test.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('sources/hemera/pnpm-lock.yaml') }}

      - working-directory: sources/hemera
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: sources/hemera/apps/desktop
        run: pnpm exec install-electron

      - working-directory: sources/hemera
        run: pnpm typecheck
      - working-directory: sources/hemera
        run: pnpm lint
      - working-directory: sources/hemera
        run: pnpm fmt:check
      # The suites that need a window are not run here: a runner has no display server and no
      # GPU, and what this lot proves about a window is proved on a real target.
      - working-directory: sources/hemera
        env:
          HEMERA_SPECS_DIR: ${{ github.workspace }}/docs-root
        run: pnpm test
