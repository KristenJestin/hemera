name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          node tools/commit-message.ts --range "$base..$head"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      # Since Electron 42 the binary is downloaded on the first run of its `bin` script and
      # no longer by a postinstall hook. It is cached and fetched explicitly, so no job ever
      # pulls a hundred megabytes twice and no run downloads it behind a test.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      - working-directory: source
        run: pnpm typecheck
      - working-directory: source
        run: pnpm lint
      - working-directory: source
        run: pnpm fmt:check
      # The stories run as tests in a headless Chromium that Playwright downloads on demand; it
      # is cached like the Electron binary so no run fetches a browser twice.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}
      - name: Fetch the Playwright browser
        working-directory: source/packages/ui
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      # The suites that need a window are not run here: a runner has no display server and no
      # GPU, and what this lot proves about a window is proved on a real target. The stories
      # run headless, which is a page and not a window.
      - working-directory: source
        run: pnpm test

  # The beta is the application the user runs every day, and it is built from every push to the
  # integration branch (design D3-10). It carries no tag: its version is what the repository
  # answers about itself, which is why the history is fetched whole rather than shallow.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable the pinned package manager
        working-directory: source
        run: corepack enable

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source/pnpm-lock.yaml') }}

      - working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        working-directory: source/apps/desktop
        run: pnpm exec install-electron

      # `CI` is set by GitHub, and it is what the packaging refuses to build a beta without.
      - working-directory: source
        run: pnpm package --channel beta

      - uses: actions/upload-artifact@v4
        with:
          name: hemera-beta-${{ runner.os }}
          path: source/dist/package
          if-no-files-found: error

  # The beta is a single rolling pre-release: it moves with `dev`, it is not a version, and its
  # tag is deleted and recreated on every push so `beta` always points at the latest build.
  prerelease:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hemera-beta-*
          merge-multiple: true
          path: dist/package

      # One pre-release per build, and every one of them stays: the tag is the beta's own
      # version (`beta-0.0.0-<sha>`, then `beta-0.4.0-3-g<sha>` once main is tagged), so two
      # betas never share a name and an older one can be installed again from the Releases page.
      - name: Publish the beta as its own pre-release
        working-directory: dist/package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(ls *.zip | head -1)"
          version="${file#Hemera.Beta-}"; version="${version%-win.zip}"
          tag="beta-${version}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Hemera Beta ${version}" \
            --notes "Beta built from dev at ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Every beta is kept; the newest pre-release is the current one." \
            *.zip *.AppImage *.deb
