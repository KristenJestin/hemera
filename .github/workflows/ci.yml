name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

# The two repositories this one is checked against are private, so the checkout needs a token
# with access to them. Without `FORK_TOKEN` the verification cannot even install: the renderer
# is a path dependency on the fork, and the traceability table is built from the specs.
env:
  FORK_REPOSITORY: hemera-app/hemera-gpuix
  DOCS_REPOSITORY: hemera-app/hemera-docs

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          bun tools/commit-message.ts --range "$base..$head"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The three repositories are laid out the way a machine lays them out: the product, the
      # renderer fork beside it, and the documents above both.
      - uses: actions/checkout@v4
        with:
          path: sources/hemera
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPOSITORY }}
          token: ${{ secrets.FORK_TOKEN }}
          path: sources/gpuix
          # The addon is not compiled here, so the gpui submodule is not needed either.
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPOSITORY }}
          token: ${{ secrets.FORK_TOKEN }}
          path: docs-root

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install the system libraries the renderer names
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1

      - working-directory: sources/hemera
        run: bun install --frozen-lockfile
      - working-directory: sources/hemera
        run: bun run typecheck
      - working-directory: sources/hemera
        run: bun run lint
      - working-directory: sources/hemera
        run: bun run fmt:check
      # The business suite needs no GPU and no window, which is the point of it. The suites
      # that paint are not run here: a runner has no GPU, and the addon is not compiled.
      #
      # The specs are read where they live, in the documents repository, so the traceability
      # table is built against them and not against a copy taken at some point.
      - working-directory: sources/hemera
        env:
          HEMERA_SPECS_DIR: ${{ github.workspace }}/docs-root
        run: bun run test
