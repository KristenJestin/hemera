# Packaging of the application (design D0-08).
#
# One portable package per target: an archive on Windows, an AppImage and a deb on Linux.
# Nothing here signs, notarises, publishes or updates — that is lot 8. Nothing downloads at
# start either: what the package needs, the package carries.

appId: dev.hemera.app
productName: Hemera
copyright: Hemera

directories:
  output: ../../dist/package
  buildResources: build

# Only what was built, the migrations it applies at start-up, and the manifest that names its
# entry point. The sources and every development dependency stay out by not being named.
files:
  - dist/**
  - drizzle/**
  - package.json
  # And none of the development tree. electron-builder collects the production `node_modules` of
  # its own accord, whatever this list says, and what it collects from here is every platform
  # binary the dependency graph mentions: the agents themselves, as `@anthropic-ai`'s and
  # `@openai`'s own packages, 250 MB of programs the reader already has installed and signed in
  # (D5-21) — and `msgpackr`'s native accelerator, which nothing in the bundles loads. The four
  # bundles carry their own JavaScript and import nothing but `node:` and `electron`, so a
  # package of this application needs no `node_modules` at all.
  - '!node_modules/**/*'

# The two ACP adapters, which are Node scripts this application depends on and the reader never
# installs (D5-21). They travel outside the archive because a script has to be a file on disk for
# `utilityProcess.fork` to run it, and they are the folder `tools/package-desktop.ts` builds
# rather than this repository's own `node_modules`: pnpm's tree leads to the platform binaries
# above, and a package must carry none of them. The engine looks for them here, and falls back to
# `node_modules` in a development run.
#
# The `node_modules` is named on both sides on purpose: electron-builder refuses to copy an entry
# called `node_modules` at the root of a fileset, whatever the pattern, so what is handed over is
# the folder itself rather than the one above it.
extraResources:
  - from: adapters/node_modules
    to: adapters/node_modules

# The 55 locales Chromium ships weigh 47 MB unpacked and the application speaks one language.
# The folder is emptied through this option and never by hand: an empty locales folder is a
# crash at start, not a smaller package.
electronLanguages:
  - en-US

compression: normal

# What the runtime is allowed to be talked into. `RunAsNode` and the inspect arguments turn a
# packaged application into a Node interpreter for whoever sets an environment variable.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

win:
  # An archive, not an installer: the package is extracted wherever the user wants and started
  # from there, which is what the lot verifies.
  target:
    - zip

linux:
  category: Development
  # Named after the product and not the package: `@hemera/desktop` would put the deb under a
  # folder called `@hemera` that nothing creates, and fpm stops there.
  artifactName: '${productName}-${version}.${ext}'
  target:
    - AppImage
    - deb

deb:
  # Ubuntu 24.04 restricts user namespaces, which is what the Chromium sandbox is built on.
  # The profile ships with the package so the sandbox stays on without a single flag.
  appArmorProfile: build/hemera.apparmor
