packages:
  - apps/*
  - packages/*

# A dependency only runs an install script if it is allowed here. esbuild links the binary the
# end-to-end runner transpiles with; two of the refused ones download a browser driver and one
# builds a Squirrel installer, and this repository drives Electron and ships a zip, an AppImage
# and a deb.
allowBuilds:
  edgedriver: false
  electron-winstaller: false
  esbuild: true
  geckodriver: false
