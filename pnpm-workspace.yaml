packages:
  - apps/*
  - packages/*

# A dependency only runs an install script if it is allowed here. esbuild links the binary the
# end-to-end runner transpiles with; two of the refused ones download a browser driver and one
# builds a Squirrel installer, and this repository drives Electron and ships a zip, an AppImage
# and a deb. msgpackr-extract is Effect's optional native accelerator: Effect works without it.
allowBuilds:
  edgedriver: false
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  msgpackr-extract: false

# No code of this repository imports zod (see AGENTS.md, Effect). chromium-bidi brings it in
# under puppeteer-core, which loads it only for WebDriver BiDi; the end-to-end suite drives
# Electron over CDP and never reaches it. The ACP SDK, the MCP server SDK and the two bundled
# adapters depend on zod at run time to read the protocol's messages: it stays theirs, and
# Hemera's own code reads them with Effect Schema.
overrides:
  chromium-bidi: '-'

# Codex in bare mode: no environment, Hemera's MCP tools as dynamic tools forwarded to Hemera's
# server, the user's MCP servers and skills off, no title thread (see the patch's header).
patchedDependencies:
  '@agentclientprotocol/codex-acp@1.12.0': patches/@agentclientprotocol__codex-acp@1.12.0.patch
