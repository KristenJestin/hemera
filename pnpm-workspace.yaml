packages:
  - apps/*
  - packages/*

# A dependency only runs an install script if it is allowed here. esbuild links the binary the
# end-to-end runner transpiles with; two of the refused ones download a browser driver and one
# builds a Squirrel installer, and this repository drives Electron and ships a zip, an AppImage
# and a deb. The last one is the native accelerator msgpackr reaches for, which effect pulls in
# and which it does without: nothing native is compiled, and the pure JavaScript path is taken.
allowBuilds:
  edgedriver: false
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.3.2'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.3.2'
  - '@voidzero-dev/vite-plus-darwin-x64@0.3.2'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.2'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.3.2'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.3.2'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.3.2'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.2'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.3.2'
  - vite-plus@0.3.2
  - framer-motion@13.3.0
  - motion-dom@13.3.0
  - motion-utils@13.3.0
  - motion@13.3.0

patchedDependencies:
  '@agentclientprotocol/codex-acp@1.12.0': patches/@agentclientprotocol__codex-acp@1.12.0.patch
